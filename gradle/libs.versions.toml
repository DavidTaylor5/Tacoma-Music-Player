[versions]
# Build tooling
agp                 = "8.11.0"
kotlin              = "2.1.0"
ksp                 = "2.1.0-1.0.29"

# AndroidX core
core-ktx            = "1.12.0"
appcompat           = "1.6.1"
activity            = "1.8.2"
fragment            = "1.6.2"
constraintlayout    = "2.1.4"

# Architecture / Lifecycle
datastore           = "1.1.3"
navigation          = "2.7.7"
room                = "2.7.0"
workmanager         = "2.10.5"
concurrent          = "1.3.0"

# DI
hilt                = "2.57.2"
hilt-androidx       = "1.2.0"

# Compose
compose-bom         = "2024.12.01"

# Async
coroutines          = "1.8.1"

# Networking / Serialization
moshi               = "1.15.1"
retrofit            = "2.9.0"

# Media
media3              = "1.2.1"

# UI / Image
material            = "1.11.0"
coil                = "2.5.0"
ucrop               = "2.2.11"
reorderable         = "2.4.3"

# Utilities
timber              = "4.7.1"
mp3agic             = "0.9.1"

# Testing
junit               = "4.13.2"
junit-ext           = "1.1.5"
espresso            = "3.5.1"


[libraries]
# AndroidX Core
androidx-core-ktx                   = { group = "androidx.core",                name = "core-ktx",                  version.ref = "core-ktx" }
androidx-appcompat                   = { group = "androidx.appcompat",           name = "appcompat",                  version.ref = "appcompat" }
androidx-activity-ktx                = { group = "androidx.activity",            name = "activity-ktx",               version.ref = "activity" }
androidx-fragment-ktx                = { group = "androidx.fragment",            name = "fragment-ktx",               version.ref = "fragment" }
androidx-constraintlayout            = { group = "androidx.constraintlayout",    name = "constraintlayout",           version.ref = "constraintlayout" }

# DataStore
androidx-datastore-preferences       = { group = "androidx.datastore",           name = "datastore-preferences",      version.ref = "datastore" }

# Navigation
androidx-navigation-fragment-ktx     = { group = "androidx.navigation",          name = "navigation-fragment-ktx",    version.ref = "navigation" }
androidx-navigation-ui-ktx           = { group = "androidx.navigation",          name = "navigation-ui-ktx",          version.ref = "navigation" }

# Room
androidx-room-runtime                = { group = "androidx.room",                name = "room-runtime",               version.ref = "room" }
androidx-room-compiler               = { group = "androidx.room",                name = "room-compiler",              version.ref = "room" }
androidx-room-ktx                    = { group = "androidx.room",                name = "room-ktx",                   version.ref = "room" }

# WorkManager
androidx-work-runtime-ktx            = { group = "androidx.work",                name = "work-runtime-ktx",           version.ref = "workmanager" }
androidx-concurrent-futures-ktx      = { group = "androidx.concurrent",          name = "concurrent-futures-ktx",     version.ref = "concurrent" }

# Hilt — Dagger
hilt-android                         = { group = "com.google.dagger",            name = "hilt-android",               version.ref = "hilt" }
hilt-android-compiler                = { group = "com.google.dagger",            name = "hilt-android-compiler",      version.ref = "hilt" }

# Hilt — AndroidX extensions
androidx-hilt-work                   = { group = "androidx.hilt",                name = "hilt-work",                  version.ref = "hilt-androidx" }
androidx-hilt-compiler               = { group = "androidx.hilt",                name = "hilt-compiler",              version.ref = "hilt-androidx" }
androidx-hilt-navigation-compose     = { group = "androidx.hilt",                name = "hilt-navigation-compose",    version.ref = "hilt-androidx" }

# Jetpack Compose — BOM + libraries (BOM manages all compose.* versions)
androidx-compose-bom                 = { group = "androidx.compose",             name = "compose-bom",                version.ref = "compose-bom" }
androidx-compose-ui                  = { group = "androidx.compose.ui",          name = "ui" }
androidx-compose-ui-tooling-preview  = { group = "androidx.compose.ui",          name = "ui-tooling-preview" }
androidx-compose-ui-tooling          = { group = "androidx.compose.ui",          name = "ui-tooling" }
androidx-compose-material3           = { group = "androidx.compose.material3",   name = "material3" }
androidx-activity-compose            = { group = "androidx.activity",            name = "activity-compose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle",           name = "lifecycle-viewmodel-compose" }
androidx-navigation-compose          = { group = "androidx.navigation",          name = "navigation-compose",          version.ref = "navigation" }

# Coroutines
kotlinx-coroutines-core              = { group = "org.jetbrains.kotlinx",        name = "kotlinx-coroutines-core",    version.ref = "coroutines" }
kotlinx-coroutines-android           = { group = "org.jetbrains.kotlinx",        name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-guava             = { group = "org.jetbrains.kotlinx",        name = "kotlinx-coroutines-guava",   version.ref = "coroutines" }

# Networking / Serialization
squareup-moshi                       = { group = "com.squareup.moshi",           name = "moshi",                      version.ref = "moshi" }
squareup-moshi-kotlin-codegen        = { group = "com.squareup.moshi",           name = "moshi-kotlin-codegen",       version.ref = "moshi" }
squareup-retrofit                    = { group = "com.squareup.retrofit2",        name = "retrofit",                   version.ref = "retrofit" }

# Media3 — all modules must stay on the same version
androidx-media3-exoplayer            = { group = "androidx.media3",              name = "media3-exoplayer",           version.ref = "media3" }
androidx-media3-exoplayer-dash       = { group = "androidx.media3",              name = "media3-exoplayer-dash",      version.ref = "media3" }
androidx-media3-ui                   = { group = "androidx.media3",              name = "media3-ui",                  version.ref = "media3" }
androidx-media3-session              = { group = "androidx.media3",              name = "media3-session",             version.ref = "media3" }
androidx-media3-common               = { group = "androidx.media3",              name = "media3-common",              version.ref = "media3" }

# UI / Material
google-material                      = { group = "com.google.android.material",  name = "material",                   version.ref = "material" }

# Image loading
coil                                 = { group = "io.coil-kt",                   name = "coil",                       version.ref = "coil" }
coil-compose                         = { group = "io.coil-kt",                   name = "coil-compose",               version.ref = "coil" }
ucrop                                = { group = "com.github.yalantis",           name = "ucrop",                      version.ref = "ucrop" }
reorderable                          = { group = "sh.calvin.reorderable",         name = "reorderable",                version.ref = "reorderable" }

# Utilities
timber                               = { group = "com.jakewharton.timber",       name = "timber",                     version.ref = "timber" }
mp3agic                              = { group = "com.mpatric",                  name = "mp3agic",                    version.ref = "mp3agic" }

# Testing
junit                                = { group = "junit",                        name = "junit",                      version.ref = "junit" }
androidx-junit-ext                   = { group = "androidx.test.ext",            name = "junit",                      version.ref = "junit-ext" }
androidx-espresso-core               = { group = "androidx.test.espresso",       name = "espresso-core",              version.ref = "espresso" }


[bundles]
coroutines  = ["kotlinx-coroutines-core", "kotlinx-coroutines-android", "kotlinx-coroutines-guava"]
media3      = ["androidx-media3-exoplayer", "androidx-media3-exoplayer-dash", "androidx-media3-ui", "androidx-media3-session", "androidx-media3-common"]
room        = ["androidx-room-runtime", "androidx-room-ktx"]
navigation  = ["androidx-navigation-fragment-ktx", "androidx-navigation-ui-ktx"]


[plugins]
android-application = { id = "com.android.application",             version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",        version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp                 = { id = "com.google.devtools.ksp",             version.ref = "ksp" }
hilt                = { id = "com.google.dagger.hilt.android",      version.ref = "hilt" }
